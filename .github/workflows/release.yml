name: Release monorepo packages
on:
  workflow_dispatch:

env:
  CPU_CORES: 2
  HUSKY: 0

jobs:
  release:
    name: Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: npm-release
      url: https://www.npmjs.com/org/jentic
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.10.0
          registry-url: https://registry.npmjs.org
      - name: Install monorepo dependencies
        run: npm ci --engine-strict=false
      - name: Build monorepo
        run: npm run build
      - name: Check TypeScript types
        run: npm run typescript:check-types
      - name: Execute tests in monorepo
        run: npm run test
      - name: Version bump & GitHub release
        run: |
          git config user.email "vladimir@jentic.com"
          git config user.name "Vladimir Gorej"
          npx lerna version prerelease --preid alpha --no-private --yes --force-publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Mark release as latest
        run: |
          VERSION=$(node -p "require('./lerna.json').version")
          gh release edit "v${VERSION}" --prerelease=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove non-build artifacts from src before publishing
        run: |
          find packages/*/src -type f ! -name '*.cjs' ! -name '*.mjs' -delete
          git config user.email "vladimir@jentic.com"
          git config user.name "Vladimir Gorej"
          git add -A
          git commit -m "chore: remove source files for publishing [skip ci]"
      - name: Publish monorepo npm packages
        run: npx lerna publish from-package --no-private --yes
