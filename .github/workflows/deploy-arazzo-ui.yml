# inspired by https://securitylab.github.com/research/github-actions-preventing-pwn-requests/
name: Deploy ArazzoUI

on:
  workflow_run:
    workflows: ["Jentic Arazzo Tools Build"]
    types:
      - completed
    branches:
      - main

jobs:

  deploy:
    if: >
      ${{ github.event.workflow_run.event == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.event.workflow_run.conclusion == 'success' }}
    name: Deploy ArazzoUI
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - name: 'Download arazzo-ui-build artifact'
        uses: actions/github-script@v9
        with:
          script: |
            const allArtifacts = await github.rest.actions.listWorkflowRunArtifacts({
               owner: context.repo.owner,
               repo: context.repo.repo,
               run_id: context.payload.workflow_run.id,
            });
            const matchArtifact = allArtifacts.data.artifacts.filter((artifact) => {
              return artifact.name == "arazzo-ui-build"
            })[0];
            const download = await github.rest.actions.downloadArtifact({
               owner: context.repo.owner,
               repo: context.repo.repo,
               artifact_id: matchArtifact.id,
               archive_format: 'zip',
            });
            const fs = require('fs');
            fs.writeFileSync('${{github.workspace}}/arazzo-ui-build.zip', Buffer.from(download.data));
      - run: |
          mkdir deploy-dir
          unzip arazzo-ui-build.zip -d deploy-dir
      - name: Inject Google Tag Manager
        uses: actions/github-script@v9
        env:
          GTAG_ID: ${{ secrets.GTAG_ID }}
        with:
          script: |
            const fs = require('fs');
            const gtagId = process.env.GTAG_ID;
            if (!gtagId) { console.log('GTAG_ID not set, skipping'); return; }
            const snippet = fs.readFileSync('packages/jentic-arazzo-ui/config/gtag.html', 'utf8').replaceAll('${GTAG_ID}', gtagId);
            const htmlPath = 'deploy-dir/index.html';
            const html = fs.readFileSync(htmlPath, 'utf8');
            if (!html.includes('<!-- ANALYTICS -->')) { throw new Error('ANALYTICS placeholder not found'); }
            fs.writeFileSync(htmlPath, html.replace('<!-- ANALYTICS -->', snippet));
            console.log(`Injected GTM (${gtagId})`)
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages # The branch the action should deploy to.
          folder: deploy-dir # The folder the action should deploy.
          clean: true # Automatically remove deleted files from the deploy branch
