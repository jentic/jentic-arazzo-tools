name: Dependabot Auto-Merge

on:
  workflow_run:
    workflows: ["Jentic Arazzo Tools Build"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot-auto-merge:
    name: Auto-merge non-major updates
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Get PR details
        id: pr
        run: |
          PR_JSON=$(gh api repos/${{ github.repository }}/pulls \
            --jq ".[] | select(.head.sha == \"$HEAD_SHA\") | {number, title, html_url, author: .user.login}")

          PR_AUTHOR=$(echo "$PR_JSON" | jq -r '.author')
          if [ "$PR_AUTHOR" != "dependabot[bot]" ]; then
            echo "PR author is $PR_AUTHOR, not dependabot[bot]. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

          PR_NUMBER=$(echo "$PR_JSON" | jq -r '.number')
          PR_TITLE=$(echo "$PR_JSON" | jq -r '.title')
          PR_URL=$(echo "$PR_JSON" | jq -r '.html_url')

          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

          # detect major updates by comparing leading version numbers in PR title
          # dependabot titles follow: "Bump <dep> from <old> to <new>"
          OLD_MAJOR=$(echo "$PR_TITLE" | grep -oP 'from \K\d+' || echo "")
          NEW_MAJOR=$(echo "$PR_TITLE" | grep -oP 'to \K\d+' || echo "")
          if [ -n "$OLD_MAJOR" ] && [ -n "$NEW_MAJOR" ] && [ "$OLD_MAJOR" != "$NEW_MAJOR" ]; then
            echo "is_major=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_major=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve PR
        if: steps.pr.outputs.skip == 'false' && steps.pr.outputs.is_major == 'false'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge PR
        if: steps.pr.outputs.skip == 'false' && steps.pr.outputs.is_major == 'false'
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
